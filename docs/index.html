<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radne nedjelje Međimurje</title>
<meta name="description" content="Koji dućani u Međimurju rade ove nedjelje — Konzum, Lidl, Kaufland, Spar, Plodine, Studenac, KTC, Eurospin.">
<meta name="theme-color" content="#0f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikone/ikona-192.png">
<link rel="apple-touch-icon" href="ikone/ikona-192.png">
<link rel="stylesheet" href="stil.css">
</head>
<body>
<header class="zaglavlje">
  <div class="zaglavlje__red">
    <div>
      <h1>Radne nedjelje</h1>
      <p class="podnaslov">Dućani s hranom u Međimurju</p>
    </div>
    <button id="osvjezi" class="ikonski" aria-label="Osvježi podatke" title="Osvježi">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>
  <nav id="nedjelje" class="nedjelje" aria-label="Odabir nedjelje"></nav>
</header>

<main>
  <section id="sazetak" class="sazetak" aria-live="polite"></section>

  <section class="filteri" aria-label="Filteri">
    <label class="polje">
      <span>Mjesto</span>
      <select id="mjesto"><option value="">Sva mjesta</option></select>
    </label>
    <div id="lanci" class="cipovi" role="group" aria-label="Lanci"></div>
    <label class="prekidac">
      <input type="checkbox" id="samoOtvoreni" checked>
      <span>Samo otvoreni</span>
    </label>
  </section>

  <section id="popis" class="popis"></section>
</main>

<footer class="podnozje">
  <p id="azurirano"></p>
  <p>Podaci se svaki dan automatski preuzimaju sa službenih stranica trgovaca. Trgovac može promijeniti radno vrijeme u zadnji čas — za sigurnost provjeri i kod trgovca.</p>
  <p><a href="privatnost.html">Pravila privatnosti</a></p>
</footer>

<template id="t-trgovina">
  <article class="trgovina">
    <div class="trgovina__lanac"></div>
    <div class="trgovina__tijelo">
      <h3 class="trgovina__naziv"></h3>
      <p class="trgovina__adresa"></p>
    </div>
    <div class="trgovina__desno">
      <span class="trgovina__vrijeme"></span>
      <div class="trgovina__gumbi">
        <button class="ikonski zvjezdica" aria-label="Dodaj u moje dućane">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <a class="ikonski karta" target="_blank" rel="noopener" aria-label="Otvori na karti">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        </a>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
